name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: python -m pip install -r requirements-build.txt
      - name: Use the selected Python for source-host tests
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a').write('IBFETCH_PYTHON=' + sys.executable + '\n')"
      - run: python -B -m unittest discover -s tests -q
      - run: node --test tests/frontend.test.cjs electron/tests/shell.test.cjs
      - name: Virtual display for desktop smoke checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and test extracted standalone archive (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_desktop.py
      - name: Build and test extracted standalone archive
        if: runner.os != 'Linux'
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ibfetch-${{ matrix.target }}
          path: dist/*
          retention-days: 14
