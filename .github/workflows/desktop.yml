name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Require signed and notarized macOS artifacts
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  desktop:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: python -m pip install -r requirements-build.txt
      - name: Use the selected Python for source-host tests
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a').write('IBFETCH_PYTHON=' + sys.executable + '\n')"
      - name: Install fixed JavaScript test/build dependencies without running package scripts
        working-directory: electron
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -B -m unittest discover -s tests -q
      - run: node --test tests/frontend.test.cjs electron/tests/*.test.cjs
      - name: Virtual display for desktop smoke checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and test extracted standalone archive (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_desktop.py --skip-install
      - name: Build and test extracted standalone archive
        if: runner.os != 'Linux' && !(runner.os == 'macOS' && inputs.sign_macos == true)
        run: python tools/build_desktop.py --skip-install
      - name: Keep Apple ticket lookup on HTTPS/TCP on the hosted Intel runner
        if: matrix.target == 'macos-x64' && github.event_name == 'workflow_dispatch' && inputs.sign_macos == true
        # Temporary runner-only workaround recommended by actions/runner-images#14924.
        # Blocking HTTP/3 forces stapler onto HTTPS/TCP; signature/TLS checks stay enabled.
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Build signed and notarized macOS app and verify extracted archive
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_macos == true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/build_desktop.py --skip-install --sign-macos
      - uses: actions/upload-artifact@v4
        with:
          name: ibfetch-${{ matrix.target }}
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ibfetch-${{ matrix.target }}-verification
          path: build/reports/*.json
          retention-days: 14
