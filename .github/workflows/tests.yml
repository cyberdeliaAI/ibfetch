name: Rust builds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize both Mac artifacts (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Validate signing request
        if: inputs.sign_macos && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo '::error::Run signed builds from main.'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features --lib --test parity
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          IBROADCAST_CLIENT_ID: ${{ vars.IBROADCAST_CLIENT_ID }}
        run: scripts/make-rust-macos-app.sh
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_macos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos-app.sh "target/release/ibfetch.app"
      - name: Package and verify macOS ZIP
        if: runner.os == 'macOS'
        env:
          SIGN_MACOS: ${{ inputs.sign_macos }}
        run: |
          app="target/release/ibfetch.app"
          archive="rust-artifacts/ibfetch-${{ matrix.artifact }}.zip"
          mkdir -p rust-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          check=$(mktemp -d)
          trap 'rm -rf "$check"' EXIT
          ditto -x -k "$archive" "$check"
          extracted="$check/ibfetch.app"
          codesign --verify --deep --strict "$extracted"
          "$extracted/Contents/MacOS/ibfetch" --version
          if [[ "$SIGN_MACOS" == true ]]; then
            xcrun stapler validate "$extracted"
          fi
      - name: Build Windows executable
        if: runner.os == 'Windows'
        env:
          IBROADCAST_CLIENT_ID: ${{ vars.IBROADCAST_CLIENT_ID }}
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/ibfetch.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory rust-artifacts
          Compress-Archive -Path target/release/ibfetch.exe,LICENSE -DestinationPath rust-artifacts/ibfetch-windows-x64.zip
      - name: Build Linux executable
        if: runner.os == 'Linux'
        env:
          IBROADCAST_CLIENT_ID: ${{ vars.IBROADCAST_CLIENT_ID }}
        run: |
          cargo build --locked --release
          target/release/ibfetch --version
          mkdir -p rust-artifacts
          tar -czf rust-artifacts/ibfetch-linux-x64.tar.gz -C target/release ibfetch -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ibfetch-${{ matrix.artifact }}
          path: rust-artifacts/
          if-no-files-found: error
