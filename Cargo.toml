[package]
name = "ibfetch"
version = "1.8.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Selective music downloader for iBroadcast"
publish = false
repository = "https://github.com/cyberdeliaAI/ibfetch"

[lib]
name = "ibfetch"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:image", "dep:resvg"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = "3"
flate2 = "1"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-util = "0.7"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "links", "persistence",
    "system_fonts", "wayland", "x11",
] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
resvg = { version = "0.50", optional = true, default-features = false }
rfd = { version = "0.18", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation",
    "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "parity"
path = "tests-rust/parity.rs"
